name: Build Fabric Mod Artifact

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Organize Root Files into Standard Project Structure
        run: |
          mkdir -p src/main/java/com/halloween
          mkdir -p src/main/resources/assets/halloween/sounds

          # Move Java source file if present in root
          if [ -f "HalloweenEventMod.java" ]; then
            mv HalloweenEventMod.java src/main/java/com/halloween/
          fi

          # Move Config files if present in root
          if [ -f "fabric.mod.json" ]; then
            mv fabric.mod.json src/main/resources/
          fi

          if [ -f "sounds.json" ]; then
            mv sounds.json src/main/resources/assets/halloween/
          fi

          if [ -f "spooky_music.ogg" ]; then
            mv spooky_music.ogg src/main/resources/assets/halloween/sounds/
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenMod-JAR
          path: build/libs/*.jar
